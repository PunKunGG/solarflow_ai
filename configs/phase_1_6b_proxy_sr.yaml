  "proxies": [
    {
      "id": "itek_360_mono",
      "label": "Itek Energy IT-360-SE72",
      "group": "Itek_360_mono",
      "variable": "sr",
      "role": "architecture-nearest measured mono-Si PERC proxy",
      "limitation": "Monofacial/single-glass reference; not the target JA Solar bifacial double-glass module."
    },
    {
      "id": "qcells_300_mono",
      "label": "QCells Q.PEAK-G4.1 300",
      "group": "Qcells_300_mono",
      "variable": "sr",
      "role": "independent measured mono-Si PERC proxy",
      "limitation": "Different manufacturer, module construction, and nameplate power from the target module."
    },
    {
      "id": "mission_300_mono",
      "label": "Mission Solar MSE300SQ5T",
      "group": "Mission_300_mono",
      "variable": "sr",
      "role": "independent measured mono-Si PERC proxy",
      "limitation": "Different manufacturer, module construction, and nameplate power from the target module."
    }
  ],
  "gates": {
    "positive_gain_percent": 0.0,
    "provisional_margin_percent": 0.10
  },
  "interpretation": {
    "weighting_equation": "Integral[E_AM1.5G(lambda) * SR_proxy(lambda) * T_retrofit(lambda)/T_baseline(lambda)] divided by Integral[E_AM1.5G(lambda) * SR_proxy(lambda)]",
    "output_quantity": "relative normalized-photocurrent proxy gain",
    "absolute_units": "none; normalized SR curves cannot establish absolute current or power",
    "ensemble_rule": "Report every proxy and the across-proxy minimum/median/maximum; do not select only the most favorable proxy."
  },
  "required_warnings": [
    "The proxy SR curves are measured data, but they are not JAM72D10-405/MB data.",
    "Normalized median SR supports relative spectral weighting only; it does not provide absolute A/W, Isc, Pmax, efficiency, or annual yield.",
    "The optical stack and n(lambda)/k(lambda) values remain conditional assumptions from Phase 1.6A.",
    "The deterministic grid is not a probability distribution or confidence interval.",
    "Do not report any Phase 1.6B value as measured or validated electrical gain of the Sirindhorn modules."
  ]
}
